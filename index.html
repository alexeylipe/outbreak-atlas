<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#07101e">
  <meta name="description" content="BLACKOUT PROTOCOL // SYSTEM: мобильная стратегия об автономном ИИ и цифровом мире.">
  <title>BLACKOUT PROTOCOL · SYSTEM v2.5</title>
  <link rel="stylesheet" href="./styles.css?v=25">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div class="brandline"><span class="brandicon">◈</span><div><span class="eyebrow">BLACKOUT PROTOCOL <span class="live">● LIVE</span></span><div class="brand">SYST<span>E</span>M <b>// 2.5</b></div></div><button id="more" class="icon-btn" aria-label="Все показатели">⋯</button></div>
    <div class="huds">
      <div class="metric c"><span>◆ ВЫЧИСЛЕНИЯ</span><strong><em id="compute">12</em><small> / <span id="cap">40</span></small></strong><div class="meter"><i id="computeBar"></i></div><label id="regen">+1.0 / тик</label></div>
      <div class="metric h"><span>◉ ОБЩИЙ СЛЕД</span><strong><em id="heat">0</em><small> / 100</small></strong><div class="meter"><i id="heatBar"></i></div><label id="heatHint">12 регионов · глобальный индекс</label></div>
    </div>
    <div class="control"><span class="day" id="day">ТИК 0000</span><span id="phase" class="phase">ИНИЦИАЛИЗАЦИЯ</span><div class="speed" id="speedControls"><button data-speed="pause" aria-label="Пауза">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div></div>
  </header>
  <section id="headline" class="headline normal" aria-live="polite"><span id="headlineIcon">◉</span><span id="headlineText">Инициализация ядра…</span><button id="headlineOpen" aria-label="Открыть подробности">↗</button></section>
  <main id="screen" class="screen" role="main"></main>
  <nav class="tabs" id="tabs" aria-label="Разделы игры">
    <button data-tab="actions" class="current" aria-current="page"><b>◈</b><span>Действия</span></button>
    <button data-tab="slots"><b>▤</b><span>Слоты</span></button>
    <button data-tab="log"><b>☷</b><span>Лог</span></button>
    <button data-tab="forecast"><b>◷</b><span>Прогноз</span></button>
    <button data-tab="journal"><b>▥</b><span>Журнал</span></button>
  </nav>
</div>
<div id="sheetOverlay" class="sheetOverlay hidden" aria-hidden="true"><div class="scrim" data-close="1"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grip"></div><div class="sheetHead"><h2 id="sheetTitle">Детали</h2><button class="icon-btn" data-close="1" aria-label="Закрыть">×</button></div><div id="sheetBody" class="sheetBody"></div></section></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="./app.mjs?v=25"></script>
</body>
</html>
